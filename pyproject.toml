[project]
name = "genai-incident-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.1",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
]

[project.scripts]
genai-incident-assistant = "genai_incident_assistant:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
